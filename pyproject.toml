[project]
name = "webbox"
version = "0.1.0"
description = "WebBox: BabelDOC PDF translation & LLM VRAM estimation tool box"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.16.0",
    "babeldoc>=0.6.4",
    "pydantic-settings>=2.15.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
textual = ["textual>=8.2.8"]
test = ["pytest>=8.0"]

[project.scripts]
webbox-nicegui = "src.frontend.nicegui.app:main"
webbox-tui = "src.frontend.textual.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
